# 兩個容器：App 本身，以及在前面補 HTTPS 的 Caddy。
#
#   cp .env.example .env     # 填 AZURE_SPEECH_*／GEMINI_API_KEY、SITE_ADDRESS、BIND_ADDR
#   docker compose up -d --build
#
# 然後從 VPN 內的手機開 https://<SITE_ADDRESS>:8443

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # 兩組金鑰都是選填的，缺了不會讓容器起不來，只是對應的功能會退化。
      #
      # Azure Speech：發音評估的客觀逐音素分數。沒設的話「跟讀」拿不到分數，
      # 其他五種模式照樣可以用。REGION 要跟建立資源時選的區域一致。
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
      # Gemini：把分數講成中文的教練建議。沒設會退回本地摘要，Azure 的分數還看得到。
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      # 講評改走別的模型（Hugging Face 的 Inference Providers、Groq、自己的 Ollama…）。
      # 留空就是用 Gemini。四個要一起設，缺一個會退回本地摘要 ——
      # 設定頁的「跟讀的中文講評」會直接寫出缺哪一個。
      NARRATION_PROVIDER: ${NARRATION_PROVIDER:-}
      NARRATION_BASE_URL: ${NARRATION_BASE_URL:-}
      NARRATION_API_KEY: ${NARRATION_API_KEY:-}
      NARRATION_MODEL: ${NARRATION_MODEL:-}
    # 刻意不用 ports：App 不對外開埠，只有 Caddy 連得到它。
    # 直接開 3000 的話，那條路是 http，麥克風照樣不能用，只會讓人以為壞了。
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # 要用哪個名字連就填哪個：VPN 的內網 IP（10.0.0.5）或網域（speak.example.com）。
      # Caddy 的本機 CA 連 IP 都簽得出憑證。
      SITE_ADDRESS: ${SITE_ADDRESS:?請在 .env 設定 SITE_ADDRESS}
      DUCKDNS_API_TOKEN: ${DUCKDNS_API_TOKEN:-}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
    ports:
      # 用 8443 而不是 443：低於 1024 的埠要特權，而 WSL 上常常已經有東西佔著。
      # 非標準埠不影響 secure context，https://host:8443 一樣算安全來源。
      # BIND_ADDR 決定綁在哪個介面：填 VPN（WireGuard）介面的 IP，
      # 就只有 VPN 內的 peer 連得到，區網與公網掃不到這個埠。
      # 留空會綁 0.0.0.0，等於對所有網路介面開放 —— 這個 App 沒有帳號密碼，別這樣放。
      - '${BIND_ADDR:-0.0.0.0}:${HTTPS_PORT:-8443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # caddy_data 裡有本機 CA 的私鑰與簽出來的憑證。刪掉這個 volume 等於換一張 CA，
      # 每台裝置都要重裝根憑證 —— 所以它是具名 volume，不是綁在容器生命週期上。
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

# 要走 Let's Encrypt（Caddyfile 裡的 DNS-01）的話，官方映像檔沒有 DNS 模組，
# 把上面 caddy 服務的 `image:` 換成下面這段自己建：
#
#   build:
#     dockerfile_inline: |
#       FROM caddy:2-builder AS builder
#       RUN xcaddy build --with github.com/caddy-dns/duckdns
#       FROM caddy:2-alpine
#       COPY --from=builder /usr/bin/caddy /usr/bin/caddy
#
# 把 duckdns 換成 cloudflare（或其他 caddy-dns 模組）就是換一家 DNS 供應商。

volumes:
  caddy_data:
  caddy_config:
