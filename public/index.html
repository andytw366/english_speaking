<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英語學習練習</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1>英語學習練習</h1>
        <p class="app__subtitle" id="subtitle"></p>
      </header>

      <nav class="tabs" id="nav" aria-label="練習模式"></nav>

      <div id="view"></div>

      <footer class="app__footer">
        <p class="hint">
          跟讀模式的錄音需要麥克風權限，且必須從 <code>localhost</code> 開啟（區網 IP
          不算 secure context，瀏覽器會擋掉麥克風）。學習進度存在瀏覽器的
          <code>localStorage</code>，換瀏覽器或清除資料就會消失。
        </p>
      </footer>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
