<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>英語學習練習</title>

    <!-- 加到主畫面之後就像一個 App 一樣開（沒有網址列）。圖示是 scripts/build-icons.mjs 產的 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="英語練習" />
    <!-- 瀏覽器 UI 的顏色跟著深淺色走，不然淺色的網址列會貼在深色的畫面上 -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14171a" />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--
      三個區塊的外殼：左側常駐的模式列（桌機）、中間的練習區、
      螢幕下方的模式列（手機）。模式模組只認得 #view，不必知道自己被排在哪裡。
    -->
    <div class="shell">
      <aside class="rail">
        <h1 class="rail__title">英語學習練習</h1>
        <nav class="tabs" id="nav" aria-label="練習模式"></nav>
        <div class="rail__today" id="railToday"></div>
        <div class="railkeys" id="railKeys" hidden></div>
      </aside>

      <main class="page">
        <header class="page__head">
          <div class="page__heading">
            <h2 class="page__title" id="pageTitle">載入中…</h2>
            <p class="page__subtitle" id="subtitle"></p>
          </div>
          <!-- 沒有側欄的寬度才看得到：設定沒有進下方那一列 -->
          <button class="page__gear" id="gear" type="button" aria-label="設定">⚙️</button>
        </header>

        <div id="view"></div>

        <footer class="page__foot">
          <p class="hint">
            跟讀模式的錄音需要麥克風權限，且必須從 <code>localhost</code> 開啟（區網 IP
            不算 secure context，瀏覽器會擋掉麥克風）。學習進度存在瀏覽器的
            <code>localStorage</code>，換瀏覽器或清除資料就會消失。
          </p>
        </footer>
      </main>
    </div>

    <nav class="dock" id="dock" aria-label="練習模式（螢幕下方）"></nav>

    <script type="module" src="app.js"></script>
  </body>
</html>
